<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Black Flash Era</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1 class="logo">
        BLACK FLASH ERA
    </h1>

</header>

<!-- DEPTH -->

<div class="depth-menu">

    <button class="depth-btn active" onclick="showPage('character-page', this)">
        캐릭터 정보
    </button>

    <button class="depth-btn" onclick="showPage('tier-page', this)">
        티어리스트
    </button>

</div>

<!-- CHARACTER PAGE -->

<div class="page active" id="character-page">

    <!-- 자동 생성 -->
    <div class="character-grid" id="characterGrid"></div>

</div>

<!-- TIER PAGE -->

<div class="page" id="tier-page">

<!-- 공지 -->

<div class="tier-notice">

    <div class="notice-left">

        <span class="notice-badge">
            NOTICE
        </span>

    </div>

    <div class="notice-slide">

        <div class="notice-track">

    <div class="notice-item">
        전체 티어리스트는 참고용 기준으로 제작되었습니다.
    </div>

    <div class="notice-item">
        정확한 성능 평가는 역할군별 티어리스트를 확인해주세요.
    </div>

    <div class="notice-item">
        티어는 지속적인 테스트를 통해 변경될 수 있습니다.
    </div>

    <!-- 첫 문구 복사 -->

    <div class="notice-item">
        전체 티어리스트는 참고용 기준으로 제작되었습니다.
    </div>


</div>

    </div>

</div>
  
    <!-- ROLE FILTER -->

    <div class="role-filter" id="roleFilter">

        <button class="role-btn active"
        onclick="filterRole('all', this)">
            전체
        </button>

        <button class="role-btn"
        onclick="filterRole('aoe', this)">
            격투딜러
        </button>

        <button class="role-btn"
        onclick="filterRole('single', this)">
            술사딜러
        </button>

        <button class="role-btn"
        onclick="filterRole('tank', this)">
            탱커
        </button>

        <button class="role-btn"
        onclick="filterRole('healer', this)">
            힐러
        </button>

        <button class="role-btn"
        onclick="filterRole('support', this)">
            서포터
        </button>

    </div>

    <!-- 자동 생성 -->

    <div id="tierContainer"></div>

</div>
<!-- POPUP -->

<div class="popup" id="popup">

    <div class="popup-content">

        <div class="close-btn" onclick="closePopup()">
            ×
        </div>

        <img class="popup-image" id="popup-image">

        <div class="popup-body">

            <!-- ❌ 이름 영역 완전 삭제 -->
            <!-- <div class="popup-title" id="popup-title"></div> -->

            <div class="skill-grid" id="popup-skills"></div>

        </div>

    </div>

</div>

<script src="script.js"></script>

<footer class="footer">

    <div class="footer-inner">

        <div class="footer-text">
            제작자 : S1 기차나
        </div>

        <!-- SNS 버튼 묶음 -->
        <div class="footer-sns">

            <!-- DISCORD -->
            <a class="footer-btn discord"
               href="https://discord.gg/xYAcG65mXu"
               target="_blank">

                <img class="sns-icon"
                     src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png"
                     alt="discord">

                <span>디스코드</span>

            </a>

            <!-- KAKAO -->
            <a class="footer-btn kakao"
               href="https://open.kakao.com/o/gXcLKUti"
               target="_blank">

                <img class="sns-icon"
                     src="https://cdn-icons-png.flaticon.com/512/2111/2111466.png"
                     alt="kakao">

                <span>카카오톡 오픈채팅방</span>

            </a>

        </div>

        <div class="footer-copy">
            Copyright © 2026 BLACK FLASH ERA. All rights reserved.
        </div>

    </div>

</footer>

</body>
</html>
